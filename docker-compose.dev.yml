version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx-dev
    ports:
      - '8000:80'
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api
    networks:
      - app-network

  frontend:
    image: node:20
    container_name: quiz-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - '5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  api:
    image: python:3.10-slim
    container_name: quiz-api-dev
    working_dir: /app
    volumes:
      - ./api:/app
      - ./api/tests.json:/app/tests.json
    expose:
      - '8000'
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - ENVIRONMENT=development
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
