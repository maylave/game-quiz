version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx-dev
    ports:
      - '80:80'
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api
    networks:
      - app-network
    entrypoint: >
      sh -c "
        echo 'Waiting for services...';
        while ! nslookup frontend >/dev/null 2>&1; do sleep 1; done;
        while ! nslookup api >/dev/null 2>&1; do sleep 1; done;
        echo 'Services are ready! Starting Nginx...';
        exec nginx -g 'daemon off;'
      "

  frontend:
    image: node:20
    container_name: quiz-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Изоляция node_modules
    expose:
      - '5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  api:
    image: python:3.10-slim
    container_name: quiz-api-dev
    working_dir: /app
    volumes:
      - ./api:/app
      - ./api/tests.json:/app/tests.json
      - ./api/data:/app/data
    expose:
      - '8000'
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - ENVIRONMENT=development
      - key_jwt=${key_jwt} # Берется из .env файла рядом с docker-compose.yml
      - DATABASE_URL=sqlite:///./data/quiz.db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
