version: '3.8'

services:
  frontend:
    image: node:20 # Не собираем образ, а запускаем Node напрямую
    container_name: quiz-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Исключаем локальные node_modules
    ports:
      - '5173:5173' # Порт Vite
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  api:
    image: python:3.10-slim
    container_name: quiz-api-dev
    working_dir: /app
    volumes:
      - ./api:/app # Монтируем код для мгновенного обновления
      - ./api/tests.json:/app/tests.json # Монтируем файл данных
    ports:
      - '8000:8000' # Пробрасываем порт Swagger наружу
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - ENVIRONMENT=development