version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx-dev
    ports:
      - '80:80'
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api
    networks:
      - app-network
    # Nginx будет проксировать запросы на frontend:5173 и api:8000
    # Убедись, что в dev.conf upstream указывает на имена сервисов

  frontend:
    image: node:22
    container_name: quiz-frontend-dev
    working_dir: /app
    volumes:
      # Монтируем исходный код с хоста в контейнер
      - ./frontend:/app
      # ВАЖНО: Исключаем node_modules из монтирования, чтобы использовать те, что внутри контейнера
      - /app/node_modules
    ports:
      - '5173:5173' # Пробрасываем порт для HMR (Hot Module Replacement)
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development
      # Если Vite ругается на память, можно добавить:
      - CHOKIDAR_USEPOLLING=true # Иногда нужно для Docker на Windows/Mac
    networks:
      - app-network
    stdin_open: true
    tty: true

  api:
    image: python:3.10-slim
    container_name: quiz-api-dev
    working_dir: /app
    volumes:
      - ./api:/app
      - ./api/tests.json:/app/tests.json
      - ./api/data:/app/data
    expose:
      - '8000'
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - ENVIRONMENT=development
      - key_jwt=${key_jwt}
      - DATABASE_URL=sqlite:///./data/quiz.db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
