server {
    listen 80;
    server_name localhost;

    # Прокси на Vite Dev Server (Frontend)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        
        # Критично для WebSocket (HMR в Vite)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        
        # Увеличиваем таймауты, так как npm install может долго идти
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Прокси на FastAPI (Backend)
    # Если твой фронтенд делает запросы на /api/login, то этот блок превратит их в /login для бэкенда
    location /api/ {
        proxy_pass http://api:8000/; # Слэш в конце важен!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}