version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod # Используем отдельный Dockerfile для продакшена (см. ниже)
    container_name: quiz-frontend-prod
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api
    networks:
      - app-network
    # Для продакшена можно добавить healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod # Используем отдельный Dockerfile для продакшена
    container_name: quiz-api-prod
    restart: always
    # В продакшене мы НЕ монтируем volumes с кодом, чтобы избежать изменений на лету
    # Если нужно сохранять tests.json, используем именованный том
    volumes:
      - quiz-data:/app/data 
    environment:
      - ENVIRONMENT=production
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  quiz-data: # Именованный том для хранения данных (tests.json)

networks:
  app-network:
    driver: bridge