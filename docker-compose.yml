version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: vue-frontend
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      # Пробрасываем конфиг nginx, чтобы он пересылал запросы /api на python
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    image: python:3.10-slim
    container_name: quiz-api
    restart: always
    working_dir: /app
    volumes:
      - ./api:/app

      - ./api/tests.json:/app/tests.json
    command:
      sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0
      --port 8000"
    expose:
      - '8000'
