version: '3.8'

services:
  # Сервис фронтенда теперь сам себя собирает и раздает
  frontend:
    build:
      context: ./frontend # Путь к папке с Vue проектом и Dockerfile
      dockerfile: Dockerfile
    container_name: vue-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api
    networks:
      - app-network

  api:
    image: python:3.10-slim
    container_name: quiz-api
    restart: always
    working_dir: /app
    volumes:
      - ./api:/app
      - ./api/tests.json:/app/tests.json
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000"
    expose:
      - '8000'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge